name: 验证插件

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-withskillhub
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-withskillhub/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/checkout@v4
        with:
          repository: deepseek-harness/deepseek-harness
          path: deepseek-harness-master
      - run: pnpm install --frozen-lockfile
        working-directory: deepseek-harness-master
      - run: pnpm run build
        working-directory: deepseek-harness-master
      - run: npm ci
        working-directory: dsh-withskillhub
      - run: npm run validate
        working-directory: dsh-withskillhub
